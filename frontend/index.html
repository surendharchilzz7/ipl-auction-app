      <h1>🏏 IPL Mock Auction – Free Online Real-Time Cricket Auction Simulator</h1>
      <p>
        Welcome to <strong>IPL Mock Auction</strong> – the ultimate fantasy cricket auction simulator that brings the
        thrill of the Indian Premier League auction to your fingertips! Experience the high-stakes excitement of
        building your dream IPL team through live auctions.
      </p>

      <h2>What is IPL Mock Auction?</h2>
      <p>
        IPL Mock Auction is a free-to-play, real-time multiplayer auction simulation game. Create a room, invite your
        friends, and bid on over 600 real IPL players to build the strongest squad. Play any season from 2008 to 2025
        with authentic player databases, team budgets, and auction rules.
      </p>

      <h2>Key Features</h2>
      <ul>
        <li><strong>Real-Time Multiplayer:</strong> Play with up to 10 friends in live auction rooms</li>
        <li><strong>Smart AI Teams:</strong> Challenge intelligent AI bidders that use real auction strategies</li>
        <li><strong>All IPL Seasons (2008–2025):</strong> Complete historical player database with 600+ players</li>
        <li><strong>Historical Teams:</strong> Play as Deccan Chargers, Pune Warriors, Gujarat Lions, and more</li>
        <li><strong>RTM System:</strong> Authentic Right to Match mechanics following official 2025 IPL rules</li>
        <li><strong>Configurable Budgets:</strong> Set team budgets from ₹120 Cr to ₹200 Cr</li>
        <li><strong>Player Retention:</strong> Pre-auction retention phase with authentic cost structures</li>
        <li><strong>Voice &amp; Text Chat:</strong> Communicate with friends during the auction</li>
        <li><strong>Mobile Friendly:</strong> Play anywhere on any device</li>
      </ul>

      <h2>How to Play</h2>
      <ol>
        <li>Enter your name and create a new auction room or join one with a room code</li>
        <li>Select your IPL franchise from the 10 available teams</li>
        <li>Optionally retain players from the previous season's squad</li>
        <li>Bid on players as they are presented in sets (BAT, BOWL, AR, WK)</li>
        <li>Manage your budget wisely to build the strongest balanced squad</li>
        <li>Use RTM cards strategically to retain key players</li>
      </ol>

      <h2>About</h2>
      <p>
        IPL Mock Auction was created by <strong>Surendhar</strong>, a passionate cricket fan and software developer.
        This is a fan-made simulation for entertainment and educational purposes. It is not affiliated with IPL, BCCI,
        or any official cricket organization.
      </p>

      <h2>Our Mission</h2>
      <p>
        We created IPL Mock Auction to give cricket fans a realistic simulation of the actual IPL auction experience.
        Our goal is to provide an engaging, educational, and entertaining platform where fans can experience the
        pressure of building a balanced squad within budget constraints, understand player valuations and auction
        strategies, and compete with friends in real-time multiplayer auctions.
      </p>

      <h2>Disclaimer</h2>
